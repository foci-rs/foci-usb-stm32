[package]
name = "foci-usb-stm32"
version = "0.4.2"
edition = "2024"
license = "GPL-3.0-or-later"
description = "USB OTG CDC-ACM driver for Klipper protocol (port of usbotg.c + usb_cdc.c)"
repository = "https://github.com/foci-rs/foci-usb-stm32"

[dependencies]
cortex-m = "0.7"
defmt = "1.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Lints that fire in this crate today; drop an entry once its findings are fixed.
cast_possible_wrap = "allow"
inline_always = "allow"
match_same_arms = "allow"
must_use_candidate = "allow"
similar_names = "allow"
trivially_copy_pass_by_ref = "allow"
