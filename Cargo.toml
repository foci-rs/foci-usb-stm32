[package]
name = "foci-usb-stm32"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "STM32 USB OTG CDC-ACM transport for Klipper protocol (port of usbotg.c + usb_cdc.c)"
repository = "https://github.com/foci-rs/foci-usb-stm32"

[dependencies]
cortex-m = "0.7"
embassy-stm32 = { version = "0.6", default-features = false }
defmt = "1.0"
